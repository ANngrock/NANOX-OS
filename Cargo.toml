[workspace]
members = ["boot/uefi", "kernel", "crates/boot-protocol", "crates/hw-acpi", "crates/hw-pci", "crates/hw-smp", "crates/hw-iommu", "crates/hw-nvme", "crates/hw-xhci", "crates/fb-console", "crates/canvas", "crates/hid-keyboard", "crates/hw-svm", "crates/guest-boot", "crates/vmm-devices", "crates/qga", "crates/svc", "crates/vswitch", "crates/nanox-ir", "crates/proofs", "crates/runtime", "crates/linux-compat", "crates/serverwin", "tools/hostguest/init", "user/hello", "crates/dep-sched", "tools/svm-probe", "tools/xtask"]
default-members = ["tools/xtask", "crates/boot-protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 2
strip = false
incremental = false
