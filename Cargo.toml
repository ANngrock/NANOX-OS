[workspace]
members = ["boot/uefi", "kernel", "crates/boot-protocol", "crates/net-wire", "crates/net-tcp", "crates/net-stack", "tools/xtask"]
default-members = ["tools/xtask", "crates/boot-protocol", "crates/net-wire", "crates/net-tcp", "crates/net-stack"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"
version = "0.1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 2
strip = false
incremental = false
