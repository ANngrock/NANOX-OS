# NANOX-OS toolchain pins (M0).  Checked by `make doctor` (tools/doctor.py).
#
#   <tool> = X.Y.Z       exact version, compared with the tool's --version output
#   <tool>.min = X.Y     minimum version; used only for tools that cannot change
#                        build outputs (python3 runs stdlib-only scripts, make
#                        only schedules commands)
#   <fw>.sha256 = HEX    exact hash of the firmware file the bench boots
#
# A profile is trusted only with `status = verified`, i.e. after `make doctor &&
# make && make test && make repro-check` passed in that environment.  Changing a
# pin is a reviewed commit, never an automatic update.

# Reference environment, verified 2026-09-24: Ubuntu 24.04 packages
#   clang 1:18.0-59~exp2 -> clang-18 1:18.1.3-1ubuntu1,
#   lld 1:18.0-59~exp2 -> lld-18 1:18.1.3-1ubuntu1,
#   qemu-system-x86 1:8.2.2+ds-0ubuntu1.18, ovmf 2024.02-2ubuntu0.9,
#   mtools 4.0.43-1build1, make 4.3-4.1build2.
[profile ubuntu-24.04]
status = verified
clang = 18.1.3
ld.lld = 18.1.3
lld-link = 18.1.3
qemu-system-x86_64 = 8.2.2
mtools = 4.0.43
ovmf_code.sha256 = 949bfa5389c4c48582737481e7d24f46b3a16b276ef44c4089a56858c6a0a446
ovmf_vars.sha256 = 5d2ac383371b408398accee7ec27c8c09ea5b74a0de0ceea6513388b15be5d1e
python3.min = 3.8
make.min = 4.0

# flake.nix devShell (nixpkgs 50ab793786d9de88ee30ec4e4c24fb4236fc2674,
# branch nixos-24.11).  Versions below are read from that nixpkgs revision's
# package definitions; the environment itself has NOT been built or run yet and
# the OVMF hashes are unknown, so doctor rejects this profile until someone
# runs the full sequence under `nix develop`, fills in the hashes printed by
# `tools/doctor.py --print-lock` and flips the status.
[profile nix]
status = unverified
clang = 18.1.8
ld.lld = 18.1.8
lld-link = 18.1.8
qemu-system-x86_64 = 9.1.3
mtools = 4.0.45
python3.min = 3.8
make.min = 4.0
