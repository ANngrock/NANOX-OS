[alias]
xtask = "run --package xtask --"

[target.x86_64-unknown-uefi]
rustflags = ["-C", "link-arg=/timestamp:0", "-C", "debuginfo=0", "-C", "link-arg=/debug:none"]

[target.x86_64-unknown-none]
rustflags = ["-C", "link-arg=-Tkernel/linker.ld", "-C", "link-arg=--build-id=none", "-C", "relocation-model=static", "-C", "code-model=kernel", "-C", "no-redzone=yes"]
